global:
  workerCount: 32
  maxInflight: 32
  seed: 3735928559
  warmupSeconds: 10
  measurementSeconds: 60
  taskCount: 0

workloads:
  # Fixed CPU iteration count - bypasses runtime calibration so every
  # run (shared / sharded) executes EXACTLY the same arithmetic per task.
  # 64000 iters ~= 200us wall on a Xeon Gold 6242 @ 2.8 GHz.
  # Re-tune: run once with `targetMillis: <target>` then paste the
  # calibrated N from summary.txt back here.
  cpu_200us_32:
    - { kind: CPU, cpuIterations: 64000, ratio: 1.0 }

profiling:
  enabled: true
  control: api
  settings: profile
  captureLocks: true
  lockEventThreshold: 100us
  start: beforeMeasurement
  stop: afterMeasurement
  filename: "${runName}.jfr"
  startCommand: "JFR.start name=${runName} settings=${settings} filename=${outputFile}"
  stopCommand: "JFR.stop name=${runName} filename=${outputFile}"

  perf:
    enabled: true
    binary: perf
    frequency: 99
    clock: monotonic
    callGraph: dwarf
    mmapPages: 2048
    extraArgs:
      - "--no-buildid"
      - "--no-buildid-cache"
      - "-z"
      - "-e"
      - "cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses"
      - "-e"
      - "context-switches,cpu-migrations"
    filename: "${runName}.perf.data"
    # --- perf stat aggregate counters (writes <runName>.perf.stat.txt) ---
    # Defaults to false in PerfConfig, so without this line no perf stat
    # txt is produced regardless of perf.enabled.
    enablePerfStat: true
    perfStatEvents:
      - cycles
      - instructions
      - branches
      - branch-misses
      - cache-references
      - cache-misses
      - LLC-loads
      - LLC-load-misses
      - context-switches
      - cpu-migrations
      - page-faults
      - task-clock
      - mem_load_l3_miss_retired.local_dram
      - mem_load_l3_miss_retired.remote_dram

  asyncProfiler:
    enabled: false
    binary: /home/wangs100/test/async-profiler-4.0-linux-x64/bin/asprof
    event: wall
    interval: 1ms
    format: jfr
    filename: "${runName}.async.jfr"
    extraArgs: []

diagnostics:
  enabled: true
  perWorkerLatency: false
  queueDepthByShard: true
  windowSampling: true
  windowCorrelation: true
  windowSeconds: 1
  slowExecutionMicros: 200

  # MUST be false for high-throughput fine-grained runs (retains every
  # Task object -> multi-GB heap -> OOM).
  shardLatencyCsv: false
  shardWindowMillis: 100

  rawTaskLogging: false
  taskExecutionCsv: false

attribution:
  enabled: true
  sampleRate: 0.01
  outputCsv: ""
  bufferCapacityPerWorker: 65536
  perfEnabled: true
  sampledPerfRate: 1.0
  perfCounters:
    - cycles
    - instructions
    - LLC-loads
    - LLC-load-misses
    - context-switches
    - cpu-migrations

runs:
  - name: shared_cpu_200us_32
    mode: shared
    workload: cpu_200us_32
    enabled: true
    pinning:
      enabled: false