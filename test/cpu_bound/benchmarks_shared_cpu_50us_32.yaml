global:
  workerCount: 32
  maxInflight: 32
  seed: 3735928559
  warmupSeconds: 10
  measurementSeconds: 60
  taskCount: 0

workloads:
  # SAME iteration count as the sharded YAML — the whole point of the
  # A/B is that ONLY the queue topology changes between runs.
  cpu_50us_32:
    - { kind: CPU, cpuIterations: 16000, ratio: 1.0 }

profiling:
  enabled: true
  control: api
  settings: profile
  # captureLocks at 100us matches the sharded YAML. SHARED mode will
  # generate many more lock/park events than sharded (the whole point);
  # tighten to 10us only for diagnostic sub-second runs.
  captureLocks: true
  lockEventThreshold: 100us
  start: beforeMeasurement
  stop: afterMeasurement
  filename: "${runName}.jfr"
  startCommand: "JFR.start name=${runName} settings=${settings} filename=${outputFile}"
  stopCommand: "JFR.stop name=${runName} filename=${outputFile}"

  perf:
    enabled: true
    binary: perf
    frequency: 99
    clock: monotonic
    callGraph: dwarf
    mmapPages: 2048
    extraArgs:
      - "--no-buildid"
      - "--no-buildid-cache"
      - "-z"
      - "-e"
      - "cycles,instructions,cache-references,cache-misses,LLC-loads,LLC-load-misses"
      - "-e"
      - "context-switches,cpu-migrations"
    filename: "${runName}.perf.data"
    # --- perf stat aggregate counters (writes <runName>.perf.stat.txt) ---
    # Defaults to false in PerfConfig, so without this line no perf stat
    # txt is produced regardless of perf.enabled.
    enablePerfStat: true
    perfStatEvents:
      - cycles
      - instructions
      - branches
      - branch-misses
      - cache-references
      - cache-misses
      - LLC-loads
      - LLC-load-misses
      - context-switches
      - cpu-migrations
      - page-faults
      - task-clock

  asyncProfiler:
    enabled: false
    binary: /home/wangs100/test/async-profiler-4.0-linux-x64/bin/asprof
    event: wall
    interval: 1ms
    format: jfr
    filename: "${runName}.async.jfr"
    extraArgs: []

diagnostics:
  enabled: true                  # enables per-worker busy/idle tracker,
                                 # Latency-averages block, Benchmark
                                 # Completion block, per-queue emptyRatio
                                 # / trueAvgDepth, and Process CPU util.
  perWorkerLatency: false
  # queueDepthByShard is still meaningful in SHARED mode: the single
  # shared queue is wired as queue[0], so the block collapses to one
  # row that reports true avg depth + empty/nonEmpty ratio for the
  # shared queue — directly comparable to the aggregate across sharded
  # queues.
  queueDepthByShard: true
  windowSampling: true
  windowCorrelation: true
  windowSeconds: 1
  slowExecutionMicros: 200

  # MUST be false for high-throughput 50µs / 60s runs (same reason as
  # sharded YAML: ~5+ GB heap of retained Task objects → OOM).
  shardLatencyCsv: false
  shardWindowMillis: 100

  rawTaskLogging: false
  taskExecutionCsv: false

attribution:
  enabled: true
  sampleRate: 0.01
  outputCsv: ""
  bufferCapacityPerWorker: 65536
  perfEnabled: true
  sampledPerfRate: 1.0
  perfCounters:
    - cycles
    - instructions
    - LLC-loads
    - LLC-load-misses
    - context-switches
    - cpu-migrations

runs:
  - name: shared_cpu_50us_32
    mode: shared
    workload: cpu_50us_32
    enabled: true
    pinning:
      enabled: false
